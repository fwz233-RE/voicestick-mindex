name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Update appcast from latest release
        run: |
          set -euo pipefail
          pages_host="${GITHUB_REPOSITORY_OWNER}.github.io"
          pages_repo="${GITHUB_REPOSITORY#*/}"
          curl -fsSL "https://${pages_host}/${pages_repo}/appcast.xml" \
            -o website/public/appcast.xml || true
          if ! tag="$(gh release view --json tagName -q .tagName 2>/dev/null)"; then
            echo "No GitHub Release found; keeping existing appcast."
            exit 0
          fi
          version="${tag#v}"
          zip_asset="VoiceStick-${version}.zip"
          sig_asset="VoiceStick-${version}.signature"
          zip_length="$(gh release view "$tag" --json assets \
            -q ".assets[] | select(.name == \"${zip_asset}\") | .size")"
          if [ -z "${zip_length:-}" ]; then
            echo "Release ${tag} has no ${zip_asset}; keeping existing appcast."
            exit 0
          fi
          msi_asset="VoiceStick_${version}.msi"
          msi_length="$(gh release view "$tag" --json assets \
            -q ".assets[] | select(.name == \"${msi_asset}\") | .size" || true)"
          if ! gh release download "$tag" --pattern "$sig_asset" --dir "$RUNNER_TEMP"; then
            echo "Release ${tag} has no ${sig_asset}; keeping existing appcast."
            exit 0
          fi
          signature="$(cat "$RUNNER_TEMP/$sig_asset" | tr -d '\n')"
          notes="$(gh release view "$tag" --json body -q .body)"
          args=(
            --version "$version" \
            --zip-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${zip_asset}" \
            --signature "$signature" \
            --length "$zip_length" \
            --release-notes "$notes"
          )
          if [ -n "${msi_length:-}" ]; then
            args+=(
              --msi-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${msi_asset}" \
              --msi-length "$msi_length" \
            )
          fi
          python3 scripts/update-appcast.py "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build website
        run: npm run build
        working-directory: website
        env:
          VITE_FIRMWARE_MANIFEST_URL: https://xiaozhi-voice-assistant.oss-cn-shenzhen.aliyuncs.com/voicestick/firmwares/latest/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
